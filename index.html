<!DOCTYPE html>

        <li class="nav-item active text-start fs-4 bg-light d-flex align-items-center justify-content-center">

        <li class="nav-item text-start fs-4 d-flex align-items-center justify-content-center">

            <img class="icon" src="./assets/profile-icon.svg" alt="">
          </a>

    <main class="d-flex flex-column p-4">
      <h1 class="fw-bold">Resumo</h1>
    </main>

    <script
